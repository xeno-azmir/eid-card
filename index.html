<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak, Era!</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, #111 0%, #000 100%);
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  color: gold;
}

/* ওপেন স্ক্রিন */
#open-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, #1a1a1a 0%, #000 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  transition: opacity 1s ease-out, visibility 1s;
}

#open-button {
  padding: 15px 40px;
  font-size: 24px;
  background-color: transparent;
  color: gold;
  border: 2px solid gold;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
  animation: pulse 2s infinite;
}

/* মূল কন্টেন্টকে মাঝখানে আনার ম্যাজিক CSS */
#card-content {
  opacity: 0;
  display: flex;
  flex-direction: column;
  justify-content: center; /* লম্বালম্বি মাঝখানে */
  align-items: center;     /* আড়াআড়ি মাঝখানে */
  text-align: center;
  width: 100%;
  height: 100vh;           /* পুরো স্ক্রিন জুড়ে থাকবে */
  transition: opacity 1s ease-in;
  position: relative;
  z-index: 5;
}

/* Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite;
  z-index: 1;
}

/* Glowing Eid Mubarak */
h1 {
  margin: 0;
  font-size: 50px;
  text-shadow: 0 0 15px gold, 0 0 25px #fffacd;
  animation: glowText 2s infinite alternate;
}

/* Typing message */
#message {
  font-size: 20px;
  margin-top: 25px;
  min-height: 150px;
  color: #fffacd;
  white-space: pre-line;
  line-height: 1.6;
  padding: 0 20px;
}

/* Sparkles */
.sparkle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: gold;
  border-radius: 50%;
  opacity: 0.8;
  animation: floatUp 6s linear forwards;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes glowText {
  from {text-shadow: 0 0 15px gold;}
  to {text-shadow: 0 0 30px #fffacd;}
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity:1; }
  100% { transform: translateY(-600px) scale(1); opacity:0; }
}
</style>
</head>
<body>

<div id="open-screen">
  <button id="open-button" onclick="startSurprise()">Open Card 🎁</button>
</div>

<div id="card-content">
  <h1>Eid Mubarak 🌙</h1>
  <p id="message"></p>
</div>

<audio id="eidMusic" loop>
  <source src="eid.mp3" type="audio/mpeg">
</audio>

<script>
function startSurprise() {
  // মিউজিক চালু
  document.getElementById('eidMusic').play();

  // স্ক্রিন সরানো
  document.getElementById('open-screen').style.opacity = '0';
  document.getElementById('open-screen').style.visibility = 'hidden';

  // কন্টেন্ট দেখানো
  setTimeout(() => {
    document.getElementById('card-content').style.opacity = '1';
    generateStars();
    typeWriter();
    setInterval(createSparkle, 1000);
  }, 800);
}

// Stars
function generateStars() {
  for (let i = 0; i < 100; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random() * 100 + "%";
    star.style.left = Math.random() * 100 + "%";
    star.style.animationDuration = (Math.random() * 2 + 1) + "s";
    document.body.appendChild(star);
  }
}

// Message
const text = `💌 প্রিয় Era,
Eid Mubarak! 🌙✨
এই ঈদ হোক তোমার জন্য আনন্দময়...
এই ঈদ তোমার জীবনে নিয়ে আসুক আনন্দ,
হাসি আর ভালোবাসা।
Again Eid Mubarak Era💫✨`;
let index = 0;
function typeWriter() {
  if (index < text.length) {
    document.getElementById("message").innerHTML += text.charAt(index);
    index++;
    setTimeout(typeWriter, 60);
  }
}

// Sparkles
function createSparkle() {
  const sparkle = document.createElement("div");
  sparkle.className = "sparkle";
  sparkle.style.left = Math.random() * 100 + "%";
  sparkle.style.top = "100%";
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 6000);
}
</script>

</body>
</html>
